<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADIM SAYACI</title>
</head>
<body>
      <div id="antrenman">
        <h3> Günlük Hedef: 10.000 adım</h3>
        <p>Atılan Adım:<span id="adim">0</span></p>
         <button onclick="adımEkle(1000)">Adım Ekle </button>
        <progress id="ilerleme" value="0" max="10000"></progress>
     </div>
</body>
<script>
    let adimSayisi = 0;

    function adımEkle(adim){
        adimSayisi+=adim;
        document.getElementById("adim").textContent = adimSayisi;
        document.getElementById("ilerleme").value = adimSayisi;
        if(adimSayisi >=10000){
            alert("Tebrikler! Günlük Hedefinize Ulaştınız");
            document.body.style.backgroundColor = "yellow";
        }
    }
    
</script>
</html>
